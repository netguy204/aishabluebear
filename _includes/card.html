<a class="card" href="{{ include.post.url | relative_url }}">
  <div class="card__media">
    {% if include.post.image %}
    <img src="{{ include.post.image | relative_url }}" alt="{{ include.post.title }}" loading="lazy">
    {% endif %}
  </div>
  <div class="card__body">
    <p class="card__date">{{ include.post.date | date: "%b %-d, %Y" }}</p>
    <h3 class="card__title">{{ include.post.title }}</h3>
    {% if include.post.excerpt %}<p class="card__excerpt">{{ include.post.excerpt | strip_html | truncate: 90 }}</p>{% endif %}
  </div>
</a>
